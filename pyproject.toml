[project]
name = "remote-train"
version = "0.1.0"
description = "Standalone 2DCNN training and evaluation project migrated from Sur-Mod."
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "h5py>=3.11.0",
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "optuna>=4.3.0",
    "pandas>=3.0.0",
    "pillow>=12.1.0",
    "rtdl-num-embeddings>=0.0.12",
    "scikit-learn>=1.8.0",
    "tabm>=0.0.3",
    "tabpfn>=8.0.8",
    "tabpfn-extensions>=0.4.2",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "tqdm>=4.67.3",
    "xgboost>=3.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
